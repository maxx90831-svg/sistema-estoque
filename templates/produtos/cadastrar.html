{% extends 'base.html' %}

{% block title %}Cadastrar produto - Sistema de Estoque{% endblock %}

{% block content %}
    <h2>Cadastrar novo produto</h2>

    <form method="POST">
        <label for="nome">Nome</label>
        <input type="text" id="nome" name="nome" required>

        <label for="categoria_id">Categoria</label>
        <select id="categoria_id" name="categoria_id">
            <option value="">Selecione...</option>
            {% for categoria in categorias %}
            <option value="{{ categoria.id }}">{{ categoria.nome }}</option>
            {% endfor %}
        </select>

        <label for="quantidade">Quantidade</label>
        <input type="number" id="quantidade" name="quantidade" min="0" required>

        <label for="estoque_minimo">Estoque mínimo (dispara alerta)</label>
        <input type="number" id="estoque_minimo" name="estoque_minimo" min="0" value="5" required>

        <label for="preco">Preço</label>
        <input type="number" id="preco" name="preco" min="0" step="0.01" required>

        <label for="peso">Peso / Volume</label>
        <input type="number" id="peso" name="peso" min="0" step="0.001">

        <label for="unidade_peso">Unidade</label>
        <select id="unidade_peso" name="unidade_peso">
            <option value="kg">Quilos (kg)</option>
            <option value="l">Litros (L)</option>
            <option value="ml">Mililitros (mL)</option>
        </select>

        <button type="submit">Salvar</button>
    </form>
{% endblock %}
